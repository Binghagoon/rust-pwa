[package]
name = "rust-pwa"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
web-push = { version = "0.11", features = ["isahc"] }
tracing = "0.1"             # 로깅 매크로용
tracing-subscriber = "0.3"  # 콘솔에 로그를 예쁘게 출력하기 위함