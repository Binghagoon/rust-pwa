<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>등록 기기 관리 | Rust PWA</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f4f6fb;
            font-synthesis: none;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
        }

        .shell {
            width: min(100% - 40px, 1040px);
            margin: 0 auto;
            padding: 48px 0;
        }

        .topbar,
        .page-heading,
        .panel-heading,
        .device {
            display: flex;
            align-items: center;
        }

        .topbar,
        .page-heading,
        .panel-heading {
            justify-content: space-between;
        }

        .topbar {
            margin-bottom: 48px;
        }

        .brand {
            color: #172033;
            font-size: 15px;
            font-weight: 750;
            letter-spacing: -.02em;
            text-decoration: none;
        }

        .back-link {
            color: #59657b;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #3156d3;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #5269c9;
            font-size: 12px;
            font-weight: 750;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(26px, 4vw, 34px);
            letter-spacing: -.045em;
        }

        .description {
            margin: 10px 0 0;
            color: #6b7487;
            font-size: 15px;
        }

        .count-card {
            min-width: 124px;
            padding: 16px 20px;
            border: 1px solid #e8ebf3;
            border-radius: 14px;
            background: #fff;
            text-align: center;
        }

        .count-card strong {
            display: block;
            color: #3156d3;
            font-size: 28px;
            line-height: 1.1;
        }

        .count-card span {
            display: block;
            margin-top: 5px;
            color: #7a8395;
            font-size: 12px;
        }

        .panel {
            margin-top: 30px;
            overflow: hidden;
            border: 1px solid #e8ebf3;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 32px rgb(26 39 74 / 4%);
        }

        .panel-heading {
            min-height: 72px;
            padding: 18px 24px;
            border-bottom: 1px solid #edf0f5;
        }

        .panel-heading h2 {
            margin: 0;
            font-size: 16px;
            letter-spacing: -.02em;
        }

        .refresh-button {
            min-height: 38px;
            padding: 0 14px;
            border: 1px solid #dfe4ef;
            border-radius: 9px;
            background: #fff;
            color: #35415a;
            font: inherit;
            font-size: 13px;
            font-weight: 650;
            cursor: pointer;
        }

        .refresh-button:hover:not(:disabled) {
            border-color: #b8c5f5;
            color: #3156d3;
        }

        .refresh-button:disabled {
            cursor: wait;
            opacity: .6;
        }

        .device-list {
            padding: 0 24px;
        }

        .device {
            min-height: 82px;
            gap: 16px;
            border-bottom: 1px solid #edf0f5;
        }

        .device:last-child {
            border-bottom: 0;
        }

        .device-icon {
            display: grid;
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            place-items: center;
            border-radius: 12px;
            background: #eef2ff;
            color: #435ec6;
            font-size: 19px;
        }

        .device-info {
            min-width: 0;
            flex: 1;
        }

        .device-name {
            overflow: hidden;
            color: #263149;
            font-size: 14px;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .device-provider {
            overflow: hidden;
            margin-top: 5px;
            color: #858da0;
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status {
            flex: 0 0 auto;
            padding: 6px 9px;
            border-radius: 999px;
            background: #eaf8f0;
            color: #24784b;
            font-size: 11px;
            font-weight: 700;
        }

        .message {
            padding: 48px 20px;
            color: #778196;
            font-size: 14px;
            text-align: center;
        }

        .message.error {
            color: #b53c49;
        }

        .note {
            margin: 14px 2px 0;
            color: #8a92a2;
            font-size: 12px;
            line-height: 1.6;
        }

        .notification-form {
            display: grid;
            gap: 14px;
            padding: 22px 24px;
        }

        .notification-form label {
            display: grid;
            gap: 7px;
            color: #35415a;
            font-size: 13px;
            font-weight: 650;
        }

        .notification-form input,
        .notification-form textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #dfe4ef;
            border-radius: 9px;
            color: #263149;
            font: inherit;
            font-size: 14px;
        }

        .notification-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .notification-form input:focus,
        .notification-form textarea:focus {
            outline: 2px solid #b8c5f5;
            outline-offset: 1px;
        }

        .notification-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .send-button {
            min-height: 40px;
            padding: 0 16px;
            border: 0;
            border-radius: 9px;
            background: #3156d3;
            color: #fff;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .send-button:hover:not(:disabled) {
            background: #2648bc;
        }

        .send-button:disabled {
            cursor: wait;
            opacity: .6;
        }

        .send-status {
            color: #6b7487;
            font-size: 13px;
        }

        .send-status.error {
            color: #b53c49;
        }

        @media (max-width: 600px) {
            .shell {
                width: min(100% - 32px, 1040px);
                padding: 28px 0;
            }

            .topbar {
                margin-bottom: 38px;
            }

            .page-heading {
                align-items: flex-start;
                gap: 16px;
            }

            .count-card {
                min-width: 82px;
                padding: 12px;
            }

            .count-card strong {
                font-size: 24px;
            }

            .panel-heading,
            .device-list {
                padding-right: 16px;
                padding-left: 16px;
            }

            .device {
                gap: 11px;
            }

            .status {
                padding: 5px 7px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <nav class="topbar" aria-label="주 메뉴">
            <a class="brand" href="/">RUST PWA</a>
            <a class="back-link" href="/">앱으로 돌아가기</a>
        </nav>

        <section class="page-heading" aria-labelledby="page-title">
            <div>
                <p class="eyebrow">Admin / Devices</p>
                <h1 id="page-title">등록 기기</h1>
                <p class="description">푸시 알림을 받을 수 있도록 등록된 기기입니다.</p>
            </div>
            <div class="count-card" aria-live="polite">
                <strong id="device-count">—</strong>
                <span>등록된 기기</span>
            </div>
        </section>

        <section class="panel" aria-labelledby="list-title">
            <header class="panel-heading">
                <h2 id="list-title">기기 목록</h2>
                <button class="refresh-button" id="refresh-button" type="button">새로고침</button>
            </header>
            <div class="device-list" id="device-list" aria-live="polite" aria-busy="true">
                <div class="message">등록된 기기를 불러오는 중입니다.</div>
            </div>
        </section>
        <section class="panel" aria-labelledby="notification-title">
            <header class="panel-heading">
                <h2 id="notification-title">알림 보내기</h2>
            </header>
            <form class="notification-form" id="notification-form">
                <label for="notification-heading">
                    제목
                    <input id="notification-heading" name="title" type="text" maxlength="120" required>
                </label>
                <label for="notification-body">
                    내용
                    <textarea id="notification-body" name="body" maxlength="2000" required></textarea>
                </label>
                <div class="notification-actions">
                    <button class="send-button" id="send-button" type="submit">전체 구독자에게 보내기</button>
                    <span class="send-status" id="send-status" role="status" aria-live="polite"></span>
                </div>
            </form>
        </section>
        <p class="note">브라우저/기기 이름은 수집하지 않아 푸시 서비스 제공자만 표시합니다. 등록 정보는 서버의 JSON 저장소에 보관되며, Docker에서는 /db/devices.json을 사용합니다.</p>
    </main>

    <script>
        const deviceCount = document.getElementById('device-count');
        const deviceList = document.getElementById('device-list');
        const refreshButton = document.getElementById('refresh-button');
        const notificationForm = document.getElementById('notification-form');
        const sendButton = document.getElementById('send-button');
        const sendStatus = document.getElementById('send-status');

        function showMessage(message, isError) {
            deviceList.replaceChildren();
            const element = document.createElement('div');
            element.className = isError ? 'message error' : 'message';
            element.textContent = message;
            deviceList.append(element);
        }

        function getPushService(endpoint) {
            try {
                return new URL(endpoint).hostname;
            } catch {
                return '알 수 없는 푸시 서비스';
            }
        }

        function renderDevices(devices) {
            deviceCount.textContent = devices.length.toLocaleString('ko-KR');
            deviceList.replaceChildren();

            if (devices.length === 0) {
                showMessage('아직 등록된 기기가 없습니다.');
                return;
            }

            const fragment = document.createDocumentFragment();
            devices.forEach((device, index) => {
                const row = document.createElement('article');
                row.className = 'device';

                const icon = document.createElement('div');
                icon.className = 'device-icon';
                icon.setAttribute('aria-hidden', 'true');
                icon.textContent = '▣';

                const info = document.createElement('div');
                info.className = 'device-info';

                const name = document.createElement('div');
                name.className = 'device-name';
                name.textContent = `등록 기기 #${index + 1}`;

                const provider = document.createElement('div');
                provider.className = 'device-provider';
                provider.textContent = getPushService(device.endpoint);

                const status = document.createElement('span');
                status.className = 'status';
                status.textContent = '등록됨';

                info.append(name, provider);
                row.append(icon, info, status);
                fragment.append(row);
            });
            deviceList.append(fragment);
        }

        async function loadDevices() {
            refreshButton.disabled = true;
            deviceList.setAttribute('aria-busy', 'true');
            showMessage('등록된 기기를 불러오는 중입니다.');

            try {
                const response = await fetch('/subscribers', {
                    headers: { accept: 'application/json' }
                });
                if (!response.ok) {
                    throw new Error(`서버 요청 실패 (${response.status})`);
                }

                const devices = await response.json();
                if (!Array.isArray(devices)) {
                    throw new Error('서버에서 올바른 기기 목록을 받지 못했습니다.');
                }
                renderDevices(devices);
            } catch (error) {
                deviceCount.textContent = '—';
                showMessage(`기기 목록을 불러오지 못했습니다. ${error.message}`, true);
            } finally {
                refreshButton.disabled = false;
                deviceList.setAttribute('aria-busy', 'false');
            }
        }

        refreshButton.addEventListener('click', loadDevices);
        notificationForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            sendButton.disabled = true;
            sendStatus.className = 'send-status';
            sendStatus.textContent = '알림을 전송하고 있습니다.';

            try {
                const formData = new FormData(notificationForm);
                const response = await fetch('/notifications', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json', accept: 'text/plain' },
                    body: JSON.stringify({
                        subscribers: [],
                        title: formData.get('title'),
                        body: formData.get('body')
                    })
                });
                if (!response.ok) {
                    throw new Error(`서버 요청 실패 (${response.status})`);
                }
                sendStatus.textContent = await response.text();
            } catch (error) {
                sendStatus.className = 'send-status error';
                sendStatus.textContent = `알림 전송에 실패했습니다. ${error.message}`;
            } finally {
                sendButton.disabled = false;
            }
        });
        loadDevices();
    </script>
</body>

</html>
