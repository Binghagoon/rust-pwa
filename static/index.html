<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust PWA 푸시 알림 앱</title>
    <link rel="manifest" href="/manifest.json">
</head>

<body>
    <h1>Rust PWA 푸시 알림 🚀</h1>
    <button id="push-btn" type="button">푸시 알림 구독하기</button>

    <script>
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        const pushButton = document.getElementById('push-btn');
        const serviceWorkerRegistration = 'serviceWorker' in navigator
            ? navigator.serviceWorker.register('/sw.js')
            : null;

        async function saveSubscription(subscription) {
            const response = await fetch('/api/subscribe', {
                method: 'POST',
                body: JSON.stringify(subscription),
                headers: { 'content-type': 'application/json' }
            });

            if (!response.ok) {
                throw new Error(`서버 요청 실패 (${response.status})`);
            }
        }

        if (serviceWorkerRegistration) {
            serviceWorkerRegistration
                .then((registration) => registration.pushManager.getSubscription())
                .then((subscription) => subscription ? saveSubscription(subscription) : null)
                .catch((error) => console.error('기존 푸시 구독 동기화 실패:', error));
        }

        async function subscribePush() {
            pushButton.disabled = true;

            try {
                if (!window.isSecureContext) {
                    throw new Error('푸시 알림은 HTTPS에서만 사용할 수 있습니다. PC에서는 http://localhost:3000을 사용하거나 HTTPS를 설정하세요.');
                }

                if (!serviceWorkerRegistration || !('PushManager' in window)) {
                    throw new Error('이 브라우저에서는 푸시 알림을 사용할 수 없습니다.');
                }

                const registration = await serviceWorkerRegistration;
                const vapidKeyResponse = await fetch('/api/vapid-public-key');
                if (!vapidKeyResponse.ok) {
                    throw new Error('VAPID 공개키를 가져오지 못했습니다.');
                }

                const publicVapidKey = (await vapidKeyResponse.text()).trim();
                if (!publicVapidKey) {
                    throw new Error('서버에 VAPID 공개키가 설정되지 않았습니다.');
                }

                const existingSubscription = await registration.pushManager.getSubscription();
                if (existingSubscription) {
                    await existingSubscription.unsubscribe();
                }

                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                });

                await saveSubscription(subscription);

                alert('푸시 알림 구독이 완료되었습니다!');
            } catch (error) {
                console.error('푸시 구독 실패:', error);
                alert(`푸시 구독에 실패했습니다: ${error.message}`);
            } finally {
                pushButton.disabled = false;
            }
        }

        pushButton.addEventListener('click', subscribePush);
    </script>
</body>

</html>
