name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: rust-pwa
  BUILDER_IMAGE: rust-pwa-builder
  IMAGE_TAG: latest
  DEPLOY_PATH: /home/github-deploy/rust-pwa
  CONTAINER_NAME: rust-pwa
  HOST_PORT: 42177

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Download previous builder image
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts

          if scp -P 22 '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/releases/rust-pwa-builder-${{ env.IMAGE_TAG }}.tar.gz' builder-image.tar.gz; then
            gunzip -c builder-image.tar.gz | docker load
            echo "BUILDER_BASE_IMAGE=${{ env.BUILDER_IMAGE }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_ENV"
          else
            echo "No previous builder image found; using the Rust base image."
            echo "BUILDER_BASE_IMAGE=rust:1.89-bookworm" >> "$GITHUB_ENV"
          fi

      # 1. [Builder 이미지 빌드 및 로드] 컴파일 레이어 캐시 활용
      - name: Build Builder Stage Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: builder # Dockerfile의 builder 스테이지까지만 빌드
          platforms: linux/arm64
          load: true
          tags: ${{ env.BUILDER_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            BUILDER_BASE_IMAGE=${{ env.BUILDER_BASE_IMAGE }}
          cache-from: type=gha,scope=${{ env.BUILDER_IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILDER_IMAGE }}

      # 2. [최종 런타임 이미지 빌드] builder 스테이지의 캐시를 적극 활용하여 빠르게 빌드
      - name: Build Final Runtime Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            BUILDER_BASE_IMAGE=${{ env.BUILDER_BASE_IMAGE }}
          cache-from: |
            type=gha,scope=${{ env.IMAGE_NAME }}
            type=local,src=/tmp/.buildx-cache-builder
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      # 3. [각각 압축] 런타임 이미지와 빌더 이미지를 각각 다른 tar.gz로 분리 저장
      - name: Export and Compress Both Images
        shell: bash
        run: |
          echo "Compressing Final Image..."
          docker save '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}' | gzip -1 > runtime-image.tar.gz

          echo "Compressing Builder Image..."
          docker save '${{ env.BUILDER_IMAGE }}:${{ env.IMAGE_TAG }}' | gzip -1 > builder-image.tar.gz

      # 4. [서버 보관 및 배포] 런타임 이미지와 builder 이미지를 서버에 저장
      - name: Configure SSH and Deploy Runtime Image
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts

          ssh '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' "mkdir -p '${{ env.DEPLOY_PATH }}/releases'"
          
          # 런타임 이미지와 컴파일용 builder 이미지를 각각 업로드
          scp -P 22 runtime-image.tar.gz '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/releases/rust-pwa-${{ env.IMAGE_TAG }}.tar.gz'
          scp -P 22 builder-image.tar.gz '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/releases/rust-pwa-builder-${{ env.IMAGE_TAG }}.tar.gz'

      - name: Restart application on Server
        shell: bash
        run: |
          ssh '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' \
            "set -e; \
             gunzip -c '${{ env.DEPLOY_PATH }}/releases/rust-pwa-${{ env.IMAGE_TAG }}.tar.gz' | docker load; \
             docker rm -f '${{ env.CONTAINER_NAME }}' 2>/dev/null || true; \
             docker ps -q --filter 'publish=${{ env.HOST_PORT }}' | xargs -r docker rm -f; \
             docker run -d --name '${{ env.CONTAINER_NAME }}' --restart unless-stopped \
               -e VAPID_PUBLIC_KEY='${{ secrets.VAPID_PUBLIC_KEY }}' \
               -e VAPID_PRIVATE_KEY='${{ secrets.VAPID_PRIVATE_KEY }}' \
               -e VAPID_SUBJECT='${{ secrets.VAPID_SUBJECT }}' \
               -p 127.0.0.1:${{ env.HOST_PORT }}:3000 \
               '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'"