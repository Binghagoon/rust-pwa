name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: rust-pwa
  IMAGE_TAG: latest
  DEPLOY_PATH: /home/github-deploy/rust-pwa
  CONTAINER_NAME: rust-pwa
  HOST_PORT: 42177

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Prepare local BuildKit cache
        id: local-cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${HOME}/.cached/docker-layer"
          mkdir -p "$cache_dir"

          if [ -f "$cache_dir/index.json" ]; then
            cache_from="type=local,src=$cache_dir"
          else
            cache_from="type=gha,scope=${IMAGE_NAME}"
          fi

          echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
          echo "cache_from=$cache_from" >> "$GITHUB_OUTPUT"

      # 최종 빌드의 mode=max 캐시에는 builder 스테이지도 포함됨
      - name: Build Final Runtime Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: ${{ steps.local-cache.outputs.cache_from }}
          cache-to: type=local,dest=${{ steps.local-cache.outputs.cache_dir }},mode=max

      # 2. 런타임 이미지를 압축해 서버 배포용으로 저장
      - name: Export and Compress Runtime Image
        shell: bash
        run: |
          docker save '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}' | gzip -1 > runtime-image.tar.gz

      # 3. 서버에 런타임 이미지를 저장
      - name: Configure SSH and Deploy Runtime Image
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts

          ssh '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' "mkdir -p '${{ env.DEPLOY_PATH }}/releases'"
          
          scp -P 22 runtime-image.tar.gz '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/releases/rust-pwa-${{ env.IMAGE_TAG }}.tar.gz'

      - name: Restart application on Server
        shell: bash
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [[ -z "$ADMIN_USERNAME" || -z "$ADMIN_PASSWORD" || "$ADMIN_USERNAME" == *:* ]]; then
            echo "::error::Set non-empty ADMIN_USERNAME and ADMIN_PASSWORD secrets; username must not contain a colon."
            exit 1
          fi
          admin_username_arg=$(printf '%q' "$ADMIN_USERNAME")
          admin_password_arg=$(printf '%q' "$ADMIN_PASSWORD")
          ssh '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' \
            "set -e; \
             gunzip -c '${{ env.DEPLOY_PATH }}/releases/rust-pwa-${{ env.IMAGE_TAG }}.tar.gz' | docker load; \
             docker rm -f '${{ env.CONTAINER_NAME }}' 2>/dev/null || true; \
             docker ps -q --filter 'publish=${{ env.HOST_PORT }}' | xargs -r docker rm -f; \
             docker run -d --name '${{ env.CONTAINER_NAME }}' --restart unless-stopped \
               -v rust-pwa-devices:/db \
               -e VAPID_PUBLIC_KEY='${{ secrets.VAPID_PUBLIC_KEY }}' \
               -e VAPID_PRIVATE_KEY='${{ secrets.VAPID_PRIVATE_KEY }}' \
               -e VAPID_SUBJECT='${{ secrets.VAPID_SUBJECT }}' \
               -e ADMIN_USERNAME=${admin_username_arg} \
               -e ADMIN_PASSWORD=${admin_password_arg} \
               -p 127.0.0.1:${{ env.HOST_PORT }}:3000 \
               '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'"